repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: vendor-check
        name: Check bundled library
        entry: python scripts/sync_vendor.py --check
        language: system
        pass_filenames: false
