name: Feature or compatibility request
description: Suggest a capability or report hardware compatibility.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: Use case, model and controller firmware
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Protocol evidence or observed behavior
      description: "Link public documentation. No credentials, network addresses or raw captures. Distinguish emulator results from physical hardware."
