name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: python -m pip install -e '.[test,dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python scripts/sync_vendor.py --check
      - run: pytest tests/test_library.py tests/test_transport.py tests/test_metadata.py --cov=pyhaassohn --cov-report=xml
      - run: python -m build
      - run: python scripts/package_integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.python }}
          path: dist/*
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -e '.[test,dev]' -r requirements-ha-test.txt
      - run: mypy --python-version 3.14 --follow-imports silent --exclude _vendor custom_components/haassohn
      - run: pytest tests/integration --cov=custom_components.haassohn --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-coverage
          path: coverage.xml
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
