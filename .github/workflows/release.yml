name: Build release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[test,dev]' -r requirements-ha-test.txt
      - run: ruff check . && ruff format --check . && mypy
      - run: mypy --python-version 3.14 --follow-imports silent --exclude _vendor custom_components/haassohn
      - run: python scripts/sync_vendor.py --check
      - run: python -m pytest -p pytest_asyncio.plugin -p pytest_cov tests/test_library.py tests/test_transport.py tests/test_metadata.py --cov=pyhaassohn
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: pytest tests/integration --cov=custom_components.haassohn
      - run: python -m build && python scripts/package_integration.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidates
          path: dist/*
